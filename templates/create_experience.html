{% extends "base.html" %}
{% block meta %}
    <title>Add Experience - Stephanie </title>
{% endblock meta %}
{% block content %}
    <main>
        <section class="details-section">
            <div class="container">
                <h2 class="section-title" style="margin-bottom: 1.5rem;">Add New Experience</h2>
                <div class="detail-card" style="max-width: 700px; margin: 0 auto; background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
                    <form method="post" action="{% url 'main:create_experience' %}" class="experience-form">
                        {% csrf_token %}
                        {% for field in form %}
                            <div class="form-group" style="margin-bottom: 1.25rem;">
                                <label for="{{ field.id_for_label }}" style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: #333;">{{ field.label }}</label>
                                {{ field }}
                                {% for error in field.errors %}
                                    <p class="form-error" style="color: #dc2626; font-size: 0.875rem; margin-top: 0.25rem;">{{ error }}</p>
                                {% endfor %}
                            </div>
                        {% endfor %}
                        <div style="display: flex; gap: 10px; margin-top: 2rem;">
                            <button type="submit" class="button button-primary" style="padding: 10px 18px; background-color: #1b4332; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500;">Tambah Experience</button>
                            <a href="{% url 'main:show_experience' %}" class="button button-secondary" style="padding: 10px 18px; background-color: #6c757d; color: white; border-radius: 6px; text-decoration: none; display: inline-flex; align-items: center; font-weight: 500;">Batal</a>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>
{% endblock content %}
